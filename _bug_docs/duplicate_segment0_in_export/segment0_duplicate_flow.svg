<svg xmlns="http://www.w3.org/2000/svg" width="680" height="590" viewBox="0 0 680 590" role="img">
<title>Segment 0 重复引用的成因流程</title>
<desc>两张地图的函数流中，空函数 defines 被归到不同的段，导致 segment 0 出现两个版本，export.lgc 同时 include 两者，引发函数重定义。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.gray rect { fill: #444441; stroke: #B4B2A9; }
.gray .th { fill: #D3D1C7; }
.gray .ts { fill: #B4B2A9; }
.coral rect { fill: #712B13; stroke: #F0997B; }
.coral .th { fill: #F5C4B3; }
.coral .ts { fill: #F0997B; }
.arr { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
</style>
</defs>
<rect x="0" y="0" width="680" height="590" rx="12" fill="#1F1F1E"/>
<g class="gray">
<rect x="40" y="40" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="58" text-anchor="middle" dominant-baseline="central">test.lgc 函数流</text>
<text class="ts" x="180" y="78" text-anchor="middle" dominant-baseline="central">add sub | defines | twice half</text>
</g>
<g class="gray">
<rect x="360" y="40" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="58" text-anchor="middle" dominant-baseline="central">main.lgc 函数流</text>
<text class="ts" x="500" y="78" text-anchor="middle" dominant-baseline="central">add sub | mul div | defines | twice</text>
</g>
<line x1="180" y1="96" x2="180" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="96" x2="500" y2="128" class="arr" marker-end="url(#arrow)"/>
<g class="coral">
<rect x="40" y="130" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">decide_segments：空函数无行号，一律跟前一段</text>
<text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">defines() 的前一个函数，两张图不一样</text>
</g>
<line x1="180" y1="186" x2="180" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="186" x2="500" y2="218" class="arr" marker-end="url(#arrow)"/>
<g class="coral">
<rect x="40" y="220" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="238" text-anchor="middle" dominant-baseline="central">test 的 seg0</text>
<text class="ts" x="180" y="258" text-anchor="middle" dominant-baseline="central">add, sub, defines()</text>
</g>
<g class="gray">
<rect x="360" y="220" width="280" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="500" y="238" text-anchor="middle" dominant-baseline="central">main 的 seg0</text>
<text class="ts" x="500" y="258" text-anchor="middle" dominant-baseline="central">add, sub（defines 去了 extra 段）</text>
</g>
<line x1="180" y1="276" x2="180" y2="308" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="276" x2="500" y2="308" class="arr" marker-end="url(#arrow)"/>
<g class="gray">
<rect x="40" y="310" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="328" text-anchor="middle" dominant-baseline="central">LgcSegmentPool：MD5 不同，写成两个文件</text>
<text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">main 先注册 = segment_00，test = segment_03</text>
</g>
<line x1="340" y1="366" x2="340" y2="398" class="arr" marker-end="url(#arrow)"/>
<g class="coral">
<rect x="40" y="400" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="418" text-anchor="middle" dominant-baseline="central">export.lgc：把每张图的 refs[0] 全部放进 set</text>
<text class="ts" x="340" y="438" text-anchor="middle" dominant-baseline="central">#include segment_00 + #include segment_03</text>
</g>
<line x1="340" y1="456" x2="340" y2="488" class="arr" marker-end="url(#arrow)"/>
<g class="coral">
<rect x="40" y="490" width="600" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="508" text-anchor="middle" dominant-baseline="central">每张地图都 include export.lgc</text>
<text class="ts" x="340" y="528" text-anchor="middle" dominant-baseline="central">add / sub 被定义两次 → Function redefinition</text>
</g>
</svg>
